site_name: ai-config
site_url: https://alex-furrier.github.io/ai-config/
site_description: Declarative plugin manager for Claude Code
site_author: Alex Furrier

repo_name: alex-furrier/ai-config
repo_url: https://github.com/alex-furrier/ai-config
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
  palette:
    - scheme: default
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep-purple
      accent: deep-purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true
            merge_init_into_class: true
            docstring_style: google
            show_signature_annotations: true
            separate_signature: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11.9.0/dist/mermaid.min.js
  - javascripts/mermaid.js

nav:
  - Home: index.md
  - Commands: commands.md
  - Configuration: config.md
  - Conversion: conversion.md
  - Architecture: architecture.md
  - Project evolution: project-evolution.md
  - Decisions:
      - Overview: adr/README.md
      - Claude plugin source model: adr/0001-claude-plugin-source-model.md
      - Target-neutral plugin IR: adr/0002-target-neutral-plugin-ir.md
      - Target-native overrides: adr/0003-target-native-overrides.md
      - Codex plugin packages: adr/0004-codex-plugin-packages.md
      - Proven output ownership: adr/0005-proven-output-ownership.md
      - Observe-plan-apply sync: adr/0006-observe-plan-apply-sync.md
      - Shared skill resources: adr/0007-materialize-shared-skill-resources.md
      - Bounded sync convergence: adr/0008-bounded-sync-convergence-stages.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/alex-furrier/ai-config
